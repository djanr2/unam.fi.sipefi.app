{% load static %}
<nav id="encabezado">
    <img id="logoFI" src="{% static 'imagenes/01.png' %}" alt="SIPEFI">
    <div>
        <span class="tituloProyecto">
            Sistema Integral de Planes de Estudio <br>
            Facultad de Ingeniería
        </span>
        <br>
        <span class="textInfTitulo">versión 1.0</span>
    </div>
    <div class="unam475-wrap" aria-label="475 aniversario UNAM">
        <img class="unam475-img" src="{% static 'imagenes/unam_475_2026.jpeg' %}" alt="UNAM 475 años">
    </div>
</nav>

<div id="datosAcceso" class="rounded-bottom">
    <div id="nomFac">
        <strong>Facultad de Ingeniería, UNAM <br>Plan de desarrollo 2023-2027</strong>
    </div>

    <div id="botonesBarraAccion" class="fc-toolbar">
        <a href="/SIPEFI/Tomo_II" class="btn btn-secondary btn-sm">
            <i class="fa-solid fa-arrow-left me-1"></i> Tomo II
        </a>
        <button id="fcBtnRegresar" type="button" class="btn btn-secondary btn-sm d-none">
            <i class="fa-solid fa-list me-1"></i> Regresar al listado
        </button>
        <button id="fcBtnNuevo" type="button" class="btn btn-primary btn-sm">
            <i class="fa-solid fa-plus me-1"></i> Nueva formación
        </button>
        <button id="fcBtnGuardar" type="button" class="btn btn-danger btn-sm d-none">
            <i class="fa-solid fa-floppy-disk me-1"></i> Guardar borrador
        </button>
        <button id="fcBtnCompletar" type="button" class="btn btn-success btn-sm d-none">
            <i class="fa-solid fa-circle-check me-1"></i> Marcar completada
        </button>
        <button id="fcBtnPdf" type="button" class="btn btn-outline-light btn-sm d-none" disabled
                title="Generar PDF con la última información guardada">
            <i class="fa-solid fa-file-pdf me-1"></i> PDF
        </button>
    </div>

    <div id="infoDer">
        {% if tiene_multiples_roles %}
            <a href="/SIPEFI/seleccion-perfil/" class="btn btn-outline-light btn-sm btn-cambiar-perfil">
                Cambiar perfil
            </a>
        {% endif %}
        <a href="/SIPEFI/logout/" class="btn btn-secondary SIPEFI_LOGIN">Salir</a>
        <span>
            <i class="fa-solid fa-user"></i>
            <span id="usuario">{{ usuario }}</span> |
            <span id="rolNombre" class="perfil-actual-badge">{{ rol_nombre }}</span>
            <span id="rol" class="d-none">{{ rol }}</span>
        </span>
        <span><i class="fa-regular fa-calendar"></i> {% now "j/m/Y" %}</span>
        <span><i class="fa-regular fa-clock"></i> <span id="hora"></span></span>
    </div>
</div>
